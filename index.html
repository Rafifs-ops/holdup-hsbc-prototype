<!DOCTYPE html>
<html lang="id">
  <head>

    <style>
      .boot-splash {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;

        gap: 12px;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        color: #54565c;
      }
      .boot-splash__mark {
        width: 44px;

        color: #fff;
        display: grid;
        place-items: center;
        font-size: 20px;
        font-weight: 800;
      }
      .boot-splash__text {
        margin: 0;
        font-size: 13.5px;
      }
    </style>
  </head>

      <!-- Placeholder yang terlihat saat database lokal masih dibuka. -->

        <p class="boot-splash__text">Menyiapkan data kamu…</p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
